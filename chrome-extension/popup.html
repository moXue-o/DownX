<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --panel: #f6f7f9;
        --border: #e3e6ea;
        --text: #1f2328;
        --muted: #6b7280;
        --element: #eef0f3;
        --hover: #e4e7eb;
        --primary: #fab283;
        --success: #16a34a;
        --error: #dc2626;
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 330px;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.55 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 7px;
        font-weight: 600;
      }
      .brand img {
        width: 18px;
        height: 18px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--error);
      }
      .dot.on {
        background: var(--success);
      }
      .add {
        display: flex;
        gap: 6px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
      }
      input[type="text"] {
        flex: 1;
        min-width: 0;
        background: var(--bg);
        border: 1px solid #d0d7de;
        border-radius: 6px;
        color: var(--text);
        padding: 7px 9px;
        outline: none;
      }
      input[type="text"]::placeholder {
        color: #9aa4b2;
      }
      input[type="text"]:focus {
        border-color: var(--primary);
        box-shadow: inset 0 0 0 1px var(--primary);
      }
      button {
        background: var(--element);
        color: var(--text);
        border: 1px solid #d0d7de;
        border-radius: 6px;
        padding: 7px 13px;
        cursor: pointer;
      }
      button:hover {
        background: var(--hover);
      }
      button:active {
        transform: translateY(1px);
      }
      button.primary {
        background: var(--primary);
        color: #1a1a1a;
        border-color: #e9a271;
        font-weight: 600;
      }
      button.primary:hover {
        background: #f8a774;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 470px;
        overflow: auto;
      }
      ul::-webkit-scrollbar {
        width: 8px;
      }
      ul::-webkit-scrollbar-thumb {
        background: #d7dbe0;
        border-radius: 4px;
      }
      li {
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
      }
      li:last-child {
        border-bottom: 0;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
      }
      .name {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-weight: 600;
      }
      .tag {
        flex: none;
        font-size: 11px;
        padding: 1px 8px;
        border-radius: 999px;
        background: var(--element);
        color: var(--muted);
      }
      .tag.run {
        background: var(--primary);
        color: #1a1a1a;
      }
      .tag.done {
        background: var(--success);
        color: #fff;
      }
      .tag.err {
        background: var(--error);
        color: #fff;
      }
      .bar {
        height: 6px;
        background: #e9ecef;
        border-radius: 3px;
        margin-top: 7px;
        overflow: hidden;
      }
      .fill {
        height: 100%;
        background: var(--primary);
        border-radius: 3px;
        transition: width 0.25s;
      }
      .meta {
        display: flex;
        justify-content: space-between;
        margin-top: 5px;
        font-size: 11.5px;
        color: var(--muted);
      }
      .acts {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      .acts button {
        padding: 2px 10px;
        font-size: 12px;
        border-radius: 5px;
      }
      .empty {
        color: var(--muted);
        padding: 16px 0;
        text-align: center;
      }
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 12px;
        border-top: 1px solid var(--border);
        background: var(--panel);
        font-size: 12px;
      }
      a {
        color: #2563eb;
        cursor: pointer;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .muted {
        color: var(--muted);
      }
      #icpt.on {
        color: var(--success);
      }
    </style>
  </head>
  <body>
    <header>
      <span class="brand"><img src="icons/48.png" alt="" /><span id="dot" class="dot"></span>DownX</span>
      <span class="muted" id="hint"></span>
    </header>
    <div class="add">
      <input id="url" type="text" placeholder="粘贴下载地址，回车添加…" />
      <button id="add" class="primary">添加</button>
    </div>
    <ul id="list"></ul>
    <footer>
      <a id="opts">设置</a>
      <span id="icpt" class="muted"></span>
      <span class="muted" id="sum"></span>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
